
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>StudySync - Add Subject</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #eef2ff, #fdf2f8);
}

/* NAVBAR */

.navbar {
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 20px 50px;
    color: white;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 27px;
    font-weight: bold;
}

.nav-buttons {
    display: flex;
    gap: 12px;
}

.nav-buttons a {
    color: white;
    text-decoration: none;

    padding: 10px 18px;

    border-radius: 20px;

    font-weight: bold;

    background: rgba(255,255,255,0.18);
}

.nav-buttons a:hover {
    background: rgba(255,255,255,0.30);
}

/* CONTAINER */

.container {
    width: 90%;
    max-width: 650px;

    margin: 60px auto;
}

/* CARD */

.form-card {
    background: white;

    padding: 40px;

    border-radius: 22px;

    box-shadow: 0 12px 35px rgba(0,0,0,0.10);
}

/* HEADING */

.heading {
    text-align: center;

    margin-bottom: 30px;
}

.heading h1 {
    color: #667eea;

    margin-bottom: 10px;
}

.heading p {
    color: #777;

    line-height: 1.5;
}

/* FORM */

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;

    margin-bottom: 8px;

    font-weight: bold;

    color: #444;
}

.form-group input,
.form-group textarea {
    width: 100%;

    padding: 13px 15px;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 15px;

    outline: none;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #667eea;

    box-shadow: 0 0 0 3px rgba(102,126,234,0.12);
}

.form-group textarea {
    min-height: 120px;

    resize: vertical;
}

/* BUTTON */

.submit-button {
    width: 100%;

    border: none;

    padding: 14px;

    border-radius: 12px;

    background: linear-gradient(135deg, #667eea, #764ba2);

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

.submit-button:hover {
    transform: translateY(-2px);

    box-shadow: 0 8px 18px rgba(102,126,234,0.30);
}

/* BACK */

.back-button {
    display: block;

    text-align: center;

    margin-top: 18px;

    color: #667eea;

    text-decoration: none;

    font-weight: bold;
}

.back-button:hover {
    text-decoration: underline;
}

/* RESPONSIVE */

@media(max-width: 700px) {

    .navbar {
        padding: 20px;

        flex-direction: column;

        gap: 15px;
    }

    .nav-buttons {
        flex-wrap: wrap;

        justify-content: center;
    }

    .form-card {
        padding: 25px;
    }
}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <div class="logo">
        StudySync Admin
    </div>

    <div class="nav-buttons">

        <a href="admin-dashboard">
            Admin Dashboard
        </a>

        <a href="admin-subjects">
            Manage Subjects
        </a>

        <a href="logout">
            Logout
        </a>

    </div>

</div>


<!-- MAIN -->

<div class="container">

    <div class="form-card">

        <div class="heading">

            <h1>
                Add New Subject
            </h1>

            <p>
                Create a new subject for students to study in StudySync.
            </p>

        </div>


        <!-- FORM -->

        <form action="admin-add-subject"
              method="post">

            <div class="form-group">

                <label for="name">
                    Subject Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter subject name"
                    required>

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Enter subject description"
                    required></textarea>

            </div>


            <button
                type="submit"
                class="submit-button">

                + Add Subject

            </button>

        </form>


        <a href="admin-subjects"
           class="back-button">

            ← Back to Subjects

        </a>

    </div>

</div>

</body>
</html>
